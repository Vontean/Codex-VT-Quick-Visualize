<div id="{{ROOT_ID}}">
  <style>
    #{{ROOT_ID}} {
      display: grid;
      gap: 12px;
    }
  </style>

  <div class="card" role="group" aria-label="{{QUESTION}}">
    <div class="viz-grid">
{{OPTIONS_HTML}}
    </div>
  </div>

{{SUBMIT_BLOCK}}

  <script>
    (() => {
      const root = document.getElementById('{{ROOT_ID}}');
      const config = {{CONFIG_JSON}};
      const inputs = Array.from(root.querySelectorAll('input[type="checkbox"]'));
      const submit = root.querySelector('#{{ROOT_ID}}-submit');

      const selectedLabels = () => inputs
        .filter((input) => input.checked)
        .map((input) => input.dataset.label);

      const update = () => {
        const selected = selectedLabels();
        if (submit) submit.disabled = selected.length === 0;
      };

      inputs.forEach((input) => input.addEventListener('change', update));
      submit?.addEventListener('click', async () => {
        const selected = selectedLabels();
        const prompt = config.followUpPrompt.replace('{selected}', selected.join('、'));
        if (window.openai?.sendFollowUpMessage) {
          const payload = { prompt };
          if (config.followUpTitle) payload.title = config.followUpTitle;
          await window.openai.sendFollowUpMessage(payload);
        }
      });

      update();
    })();
  </script>
</div>
