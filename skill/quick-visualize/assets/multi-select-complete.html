<div id="{{ROOT_ID}}">
  <style>
    #{{ROOT_ID}} {
      display: grid;
      gap: 12px;
    }

    #{{ROOT_ID}} .quick-choice-list {
      display: grid;
      padding-inline: 4px;
    }

    #{{ROOT_ID}} .quick-choice-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      cursor: var(--cursor-interaction, pointer);
    }

    #{{ROOT_ID}} .quick-choice-item:first-child {
      padding-top: 0;
    }

    #{{ROOT_ID}} .quick-choice-item:last-child {
      padding-bottom: 0;
    }

    #{{ROOT_ID}} .quick-choice-item + .quick-choice-item {
      border-top: 1px solid var(--border);
    }

    #{{ROOT_ID}} .quick-choice-copy {
      display: grid;
      min-width: 0;
      gap: 2px;
    }

    #{{ROOT_ID}} .quick-choice-title {
      color: var(--card-foreground);
      font-weight: var(--font-weight-medium);
    }
  </style>

  <div class="card" role="group" aria-label="{{QUESTION}}">
    <div class="quick-choice-list">
{{OPTIONS_HTML}}
    </div>
  </div>

{{SUBMIT_BLOCK}}
  <script>
    (() => {
      const root = document.getElementById('{{ROOT_ID}}');
      const config = {{CONFIG_JSON}};
      const inputs = Array.from(root.querySelectorAll('input[type="checkbox"]'));
      const submit = root.querySelector('#{{ROOT_ID}}-submit');

      const selectedLabels = () => inputs
        .filter((input) => input.checked)
        .map((input) => input.dataset.label);

      const update = () => {
        const selected = selectedLabels();
        if (submit) submit.disabled = selected.length === 0;
      };

      inputs.forEach((input) => input.addEventListener('change', update));
      submit?.addEventListener('click', async () => {
        const selected = selectedLabels();
        const prompt = config.followUpPrompt.replace('{selected}', selected.join('、'));
        if (window.openai?.sendFollowUpMessage) {
          const payload = { prompt };
          if (config.followUpTitle) payload.title = config.followUpTitle;
          await window.openai.sendFollowUpMessage(payload);
        }
      });

      update();
    })();
  </script>
</div>
