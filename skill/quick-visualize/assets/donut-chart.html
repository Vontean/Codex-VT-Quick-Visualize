<div class="quick-donut-chart" id="{{ROOT_ID}}" role="figure" aria-labelledby="{{ROOT_ID}}-title" aria-describedby="{{ROOT_ID}}-summary">
  <style>
    #{{ROOT_ID}} {
      position: relative;
      display: grid;
      gap: 8px;
      width: 100%;
      color: var(--foreground);
    }

    #{{ROOT_ID}} .quick-donut-title {
      margin: 0;
      color: var(--foreground);
      font-weight: 500;
    }

    #{{ROOT_ID}} .quick-donut-layout {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) minmax(180px, 0.72fr);
      align-items: center;
      gap: 12px 24px;
    }

    #{{ROOT_ID}} .quick-donut-plot {
      position: relative;
      min-width: 0;
    }

    #{{ROOT_ID}} .quick-donut-svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    #{{ROOT_ID}} .quick-donut-slice {
      stroke: var(--background);
      stroke-width: 2;
      cursor: crosshair;
    }

    #{{ROOT_ID}} .quick-donut-center {
      position: absolute;
      display: grid;
      place-items: center;
      gap: 2px;
      text-align: center;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #{{ROOT_ID}} .quick-donut-center-kicker,
    #{{ROOT_ID}} .quick-donut-center-percent {
      color: var(--muted-foreground);
      font-size: 12px;
      font-weight: 400;
    }

    #{{ROOT_ID}} .quick-donut-center-label {
      max-width: 100%;
      overflow-wrap: anywhere;
      color: var(--foreground);
      font-weight: 500;
    }

    #{{ROOT_ID}} .quick-donut-center-percent {
      color: var(--foreground);
      font-weight: 500;
    }

    #{{ROOT_ID}} .quick-donut-legend {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #{{ROOT_ID}} .quick-donut-legend-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    #{{ROOT_ID}} .quick-donut-swatch {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
    }

    #{{ROOT_ID}} .quick-donut-legend-label {
      min-width: 0;
      overflow: hidden;
      color: var(--foreground);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #{{ROOT_ID}} .quick-donut-legend-percent {
      color: var(--muted-foreground);
      font-variant-numeric: tabular-nums;
    }

    #{{ROOT_ID}} .quick-donut-tooltip {
      position: absolute;
      z-index: 2;
      display: grid;
      gap: 3px;
      max-width: min(240px, calc(100% - 16px));
      padding: 8px 10px;
      color: var(--popover-foreground);
      background: var(--popover);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 6px 18px color-mix(in srgb, var(--foreground) 14%, transparent);
      pointer-events: none;
    }

    #{{ROOT_ID}} .quick-donut-tooltip[hidden],
    #{{ROOT_ID}} .quick-donut-tooltip-description[hidden] {
      display: none;
    }

    #{{ROOT_ID}} .quick-donut-tooltip-label,
    #{{ROOT_ID}} .quick-donut-tooltip-value {
      color: var(--popover-foreground);
      font-weight: 500;
    }

    #{{ROOT_ID}} .quick-donut-tooltip-description {
      color: var(--muted-foreground);
      font-size: 12px;
      font-weight: 400;
    }

    @media (max-width: 520px) {
      #{{ROOT_ID}} .quick-donut-layout {
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
      }

      #{{ROOT_ID}} .quick-donut-legend {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>

  <h3 class="quick-donut-title" id="{{ROOT_ID}}-title">{{TITLE}}</h3>
  <p class="sr-only" id="{{ROOT_ID}}-summary">{{SUMMARY}}</p>

  <div class="quick-donut-layout">
    <div class="quick-donut-plot" id="{{ROOT_ID}}-plot">
      <svg class="quick-donut-svg" id="{{ROOT_ID}}-svg" role="img" aria-labelledby="{{ROOT_ID}}-svg-title {{ROOT_ID}}-svg-desc">
        <title id="{{ROOT_ID}}-svg-title">{{TITLE}}</title>
        <desc id="{{ROOT_ID}}-svg-desc">{{SUMMARY}}</desc>
      </svg>
      <div class="quick-donut-center" id="{{ROOT_ID}}-center" aria-hidden="true">
        <span class="quick-donut-center-kicker"></span>
        <span class="quick-donut-center-label"></span>
        <span class="quick-donut-center-percent"></span>
      </div>
    </div>
    <ul class="quick-donut-legend" id="{{ROOT_ID}}-legend" aria-label="类别占比"></ul>
  </div>

  <div class="quick-donut-tooltip" id="{{ROOT_ID}}-tooltip" role="tooltip" hidden>
    <span class="quick-donut-tooltip-label"></span>
    <span class="quick-donut-tooltip-value"></span>
    <span class="quick-donut-tooltip-description" hidden></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script>
    (() => {
      const root = document.getElementById('{{ROOT_ID}}');
      const plot = root.querySelector('#{{ROOT_ID}}-plot');
      const svg = d3.select(root.querySelector('#{{ROOT_ID}}-svg'));
      const center = root.querySelector('#{{ROOT_ID}}-center');
      const centerKicker = center.querySelector('.quick-donut-center-kicker');
      const centerLabel = center.querySelector('.quick-donut-center-label');
      const centerPercent = center.querySelector('.quick-donut-center-percent');
      const legend = root.querySelector('#{{ROOT_ID}}-legend');
      const tooltip = root.querySelector('#{{ROOT_ID}}-tooltip');
      const tooltipLabel = tooltip.querySelector('.quick-donut-tooltip-label');
      const tooltipValue = tooltip.querySelector('.quick-donut-tooltip-value');
      const tooltipDescription = tooltip.querySelector('.quick-donut-tooltip-description');
      const config = {{CONFIG_JSON}};
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const total = d3.sum(config.items, (item) => item.value);
      const items = config.items.map((item, index) => ({
        ...item,
        index,
        percentage: item.value / total * 100,
      }));
      const largest = d3.greatest(items, (item) => item.value);
      const numberFormat = new Intl.NumberFormat(undefined, {
        minimumFractionDigits: config.decimals,
        maximumFractionDigits: config.decimals,
      });
      const percentFormat = new Intl.NumberFormat(undefined, {
        maximumFractionDigits: 1,
      });
      const valueText = (value) => `${config.valuePrefix}${numberFormat.format(value)}${config.valueSuffix}`;
      const percentageText = (value) => `${percentFormat.format(value)}%`;
      const colorFor = (index) => `var(--viz-series-${index + 1})`;

      const setCenter = (item, isDefault) => {
        centerKicker.textContent = isDefault ? '占比最高' : '当前占比';
        centerLabel.textContent = item.label;
        centerPercent.textContent = percentageText(item.percentage);
      };

      items.forEach((item) => {
        const legendItem = document.createElement('li');
        legendItem.className = 'quick-donut-legend-item';
        const swatch = document.createElement('span');
        swatch.className = 'quick-donut-swatch';
        swatch.style.background = colorFor(item.index);
        swatch.setAttribute('aria-hidden', 'true');
        const label = document.createElement('span');
        label.className = 'quick-donut-legend-label';
        label.textContent = item.label;
        const percentage = document.createElement('span');
        percentage.className = 'quick-donut-legend-percent';
        percentage.textContent = percentageText(item.percentage);
        legendItem.append(swatch, label, percentage);
        legend.append(legendItem);
      });

      const hideTooltip = () => {
        tooltip.hidden = true;
      };

      const positionTooltip = () => {
        const rootBounds = root.getBoundingClientRect();
        const plotBounds = plot.getBoundingClientRect();
        const tooltipBounds = tooltip.getBoundingClientRect();
        const maximumLeft = Math.max(8, rootBounds.width - tooltipBounds.width - 8);
        if (rootBounds.width <= 520) {
          const plotRight = plotBounds.right - rootBounds.left;
          tooltip.style.left = `${Math.min(maximumLeft, Math.max(8, plotRight - tooltipBounds.width - 8))}px`;
          tooltip.style.top = `${Math.max(8, plotBounds.top - rootBounds.top + 8)}px`;
          return;
        }
        const plotRight = plotBounds.right - rootBounds.left;
        tooltip.style.left = `${Math.min(maximumLeft, Math.max(8, plotRight + 8))}px`;
        tooltip.style.top = `${Math.max(8, plotBounds.top - rootBounds.top + (plotBounds.height - tooltipBounds.height) / 2)}px`;
      };

      const showTooltip = (event, item) => {
        tooltipLabel.textContent = item.label;
        tooltipValue.textContent = `${valueText(item.value)} · ${percentageText(item.percentage)}`;
        tooltipDescription.textContent = item.description;
        tooltipDescription.hidden = !item.description;
        tooltip.hidden = false;
        positionTooltip();
      };

      const draw = () => {
        const width = Math.max(1, Math.round(plot.getBoundingClientRect().width));
        if (width <= 1) return;
        const height = width < 420 ? 280 : 320;
        const centerX = width / 2;
        const centerY = height / 2;
        const outerRadius = Math.max(72, Math.min(width, height) / 2 - 18);
        const innerRadius = outerRadius * 0.62;
        const arc = d3.arc()
          .innerRadius(innerRadius)
          .outerRadius(outerRadius)
          .cornerRadius(4);
        const hoverArc = d3.arc()
          .innerRadius(innerRadius)
          .outerRadius(outerRadius + 5)
          .cornerRadius(4);
        const pie = d3.pie()
          .sort(null)
          .value((item) => item.value)
          .padAngle(0.012);

        svg.attr('viewBox', `0 0 ${width} ${height}`);
        svg.selectAll('g.quick-donut-drawing').remove();
        center.style.left = `${centerX}px`;
        center.style.top = `${centerY}px`;
        center.style.width = `${innerRadius * 1.5}px`;

        const drawing = svg.append('g')
          .attr('class', 'quick-donut-drawing')
          .attr('transform', `translate(${centerX},${centerY})`);
        drawing.selectAll('path.quick-donut-slice')
          .data(pie(items))
          .join('path')
          .attr('class', 'quick-donut-slice')
          .attr('data-chart-hit', '')
          .attr('fill', (datum) => colorFor(datum.data.index))
          .attr('d', arc)
          .each(function(datum) {
            d3.select(this).append('title').text(
              `${datum.data.label}：${valueText(datum.data.value)}，${percentageText(datum.data.percentage)}`
            );
          })
          .on('pointerenter', function(event, datum) {
            setCenter(datum.data, false);
            showTooltip(event, datum.data);
            const slice = d3.select(this);
            if (reducedMotion) {
              slice.attr('d', hoverArc);
            } else {
              slice.interrupt().transition().duration(140).attr('d', hoverArc);
            }
          })
          .on('pointermove', function(event, datum) {
            showTooltip(event, datum.data);
          })
          .on('pointerleave', function() {
            setCenter(largest, true);
            hideTooltip();
            const slice = d3.select(this);
            if (reducedMotion) {
              slice.attr('d', arc);
            } else {
              slice.interrupt().transition().duration(140).attr('d', arc);
            }
          });

        setCenter(largest, true);
        hideTooltip();
      };

      const resizeObserver = new ResizeObserver(draw);
      resizeObserver.observe(plot);
      draw();
    })();
  </script>
</div>
