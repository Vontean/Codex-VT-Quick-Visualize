<div id="{{ROOT_ID}}" role="figure" aria-labelledby="{{ROOT_ID}}-title">
<style>
#{{ROOT_ID}}{position:relative;width:100%;padding-top:32px;color:var(--foreground);--line-title-gap:32px;--line-enter:1200;--line-width:2px;--line-tip-radius:12px}
#{{ROOT_ID}} h3{margin:0 90px var(--line-title-gap) 0;font-weight:500}
#{{ROOT_ID}} .plot{position:relative}
#{{ROOT_ID}} .chart{display:block;width:100%;overflow:visible}
#{{ROOT_ID}} .chart text{font-family:inherit;font-size:12px;fill:var(--foreground);font-variant-numeric:tabular-nums}
#{{ROOT_ID}} .chart .tick-label{fill:var(--muted-foreground)}
#{{ROOT_ID}} .trend{fill:none;stroke:var(--viz-series-1);stroke-width:var(--line-width);stroke-linecap:round;stroke-linejoin:round}
#{{ROOT_ID}} .bubble{position:absolute;z-index:3;pointer-events:none;width:174px;max-width:calc(100% - 16px);padding:12px 14px;background:var(--popover);color:var(--popover-foreground);border:1px solid color-mix(in srgb,var(--border) 70%,transparent);border-radius:var(--line-tip-radius);box-shadow:0 4px 16px color-mix(in srgb,var(--foreground) 10%,transparent)}
#{{ROOT_ID}} .bubble[hidden]{display:none}
#{{ROOT_ID}} .bubble-date{font-weight:500;margin-bottom:10px;font-size:12px}
#{{ROOT_ID}} .bubble-row{display:grid;grid-template-columns:9px 1fr auto;align-items:center;gap:8px;font-size:12px}
#{{ROOT_ID}} .bubble-row strong{font-weight:500;font-variant-numeric:tabular-nums}
#{{ROOT_ID}} .swatch{width:9px;height:9px;background:var(--viz-series-1);border-radius:2px}
#{{ROOT_ID}} .keyboard{position:absolute;inset:0;opacity:0;pointer-events:none;width:100%;height:100%;margin:0}
#{{ROOT_ID}} .plot:focus-within{outline:2px solid var(--ring);outline-offset:4px}
</style>
<h3 id="{{ROOT_ID}}-title">{{TITLE}}</h3>
<div class="plot">
<svg class="chart" role="img" aria-label="{{SUMMARY}}"></svg>
<div class="text-small" style="text-align:center;color:var(--muted-foreground)" aria-hidden="true">{{X_AXIS_LABEL}}</div>
<input class="keyboard" type="range" min="0" max="29" step="1" value="0" aria-label="按左右键查看数据点">
</div>
<div class="bubble" role="tooltip" hidden><div class="bubble-date"></div><div class="bubble-row"><span class="swatch" aria-hidden="true"></span><span class="measure-label"></span><strong></strong></div><div class="description text-small" style="margin-top:8px" hidden></div></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(()=>{
const root=document.getElementById('{{ROOT_ID}}'),plot=root.querySelector('.plot'),svg=d3.select(root.querySelector('.chart')),bubble=root.querySelector('.bubble'),keyboard=root.querySelector('.keyboard');
const config={{CONFIG_JSON}};
const numberFormat=new Intl.NumberFormat(undefined,{minimumFractionDigits:config.decimals,maximumFractionDigits:config.decimals});const formatValue=v=>config.valuePrefix+numberFormat.format(v)+config.valueSuffix;
const data=config.points.map(d=>({...d,time:new Date(d.date+'T00:00:00Z')}));
root.querySelector('.measure-label').textContent=config.yAxisLabel;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');let entered=false,lastWidth=0,layout=null,active=null;
const dateLabel=d=>d.date;
keyboard.max=data.length-1;
function clear(){active=null;bubble.hidden=true;svg.selectAll('.guide,.active-halo,.active-point').attr('visibility','hidden');}
function show(index){if(!layout)return;active=Math.max(0,Math.min(data.length-1,index));const d=data[active],px=layout.x(d.time),py=layout.y(d.value);
svg.select('.guide').attr('x1',px).attr('x2',px).attr('visibility','visible');svg.selectAll('.active-halo,.active-point').attr('cx',px).attr('cy',py).attr('visibility','visible');
root.querySelector('.bubble-date').textContent=dateLabel(d);const description=root.querySelector('.description');description.textContent=d.description||'';description.hidden=!d.description;root.querySelector('.bubble-row strong').textContent=formatValue(d.value);bubble.hidden=false;keyboard.value=active;keyboard.setAttribute('aria-valuetext',dateLabel(d)+'，'+formatValue(d.value));
const rb=root.getBoundingClientRect(),pb=plot.getBoundingClientRect(),bw=bubble.offsetWidth,bh=bubble.offsetHeight;
const left=px<layout.width/2?px+18:px-bw-18;
bubble.style.left=Math.max(8,Math.min(rb.width-bw-8,left))+'px';
bubble.style.top=Math.max(pb.top-rb.top+8,Math.min(pb.top-rb.top+py-bh/2,pb.top-rb.top+layout.base-bh-8))+'px';
}
const measure=document.createElement('canvas').getContext('2d');measure.font='12px '+getComputedStyle(root).fontFamily;
function axisWidth(){return Math.max(64,...data.map(d=>d.value).map(v=>measure.measureText(formatValue(v)).width+18));}
function draw(animate=false){const width=Math.round(plot.getBoundingClientRect().width);if(width<1)return;lastWidth=width;
const height=width<420?286:330,left=Math.min(width*.42,axisWidth()),right=28,top=24,base=height-40;
const x=d3.scaleUtc().domain(d3.extent(data,d=>d.time)).range([left+3,width-right-3]);
const y=d3.scaleLinear().domain([0,d3.max(data,d=>d.value)*1.12||1]).nice().range([base,top]);layout={width,height,base,x,y};
svg.selectAll('*').interrupt();svg.selectAll('*').remove();svg.attr('viewBox',`0 0 ${width} ${height}`);
const defs=svg.append('defs'),gradient=defs.append('linearGradient').attr('id','{{ROOT_ID}}-fill').attr('x1',0).attr('x2',0).attr('y1',0).attr('y2',1);
gradient.append('stop').attr('offset','0%').attr('stop-color','var(--viz-series-1)').attr('stop-opacity',.12);gradient.append('stop').attr('offset','100%').attr('stop-color','var(--viz-series-1)').attr('stop-opacity',0);
const clip=defs.append('clipPath').attr('id','{{ROOT_ID}}-reveal').append('rect').attr('x',left-8).attr('y',top-16).attr('height',base-top+24).attr('width',animate&&!reduced.matches?0:width-left+8);
const ticks=y.ticks(4);
svg.selectAll('.grid').data(ticks.filter(v=>y(v)>top+.5&&y(v)<base-.5)).join('line').attr('class','grid').attr('x1',left).attr('x2',width-right).attr('y1',y).attr('y2',y).attr('stroke','var(--border)').attr('stroke-opacity',.65);
svg.append('path').attr('class','axis-frame').attr('d',`M${left},${top}V${base}H${width-right}`).attr('fill','none').attr('stroke','var(--border)').attr('stroke-opacity',.8);
svg.selectAll('.y-label').data(ticks).join('text').attr('class','tick-label y-label').attr('x',left-10).attr('y',v=>y(v)+4).attr('text-anchor','end').text(v=>formatValue(v));
svg.append('text').attr('class','tick-label').attr('x',left).attr('y',10).text(config.yAxisLabel);
const tickCount=Math.min(data.length,width<420?4:7);const xticks=Array.from({length:tickCount},(_,i)=>data[Math.round(i*(data.length-1)/(tickCount-1))]);
svg.selectAll('.x-label').data(xticks).join('text').attr('class','tick-label x-label').attr('x',d=>x(d.time)).attr('y',base+26).attr('text-anchor',(d,i)=>i===0?'start':i===xticks.length-1?'end':'middle').text(d=>`${d.time.getUTCMonth()+1}/${d.time.getUTCDate()}`);
const line=d3.line().x(d=>x(d.time)).y(d=>y(d.value)).curve(d3.curveMonotoneX);
const area=d3.area().x(d=>x(d.time)).y0(base).y1(d=>y(d.value)).curve(d3.curveMonotoneX);
const marks=svg.append('g').attr('class','line-marks');
marks.append('path').datum(data).attr('class','area').attr('clip-path','url(#{{ROOT_ID}}-reveal)').attr('d',area).attr('fill','url(#{{ROOT_ID}}-fill)');
const trend=marks.append('path').datum(data).attr('class','trend').attr('d',line);
const endpoint=marks.append('g').attr('class','endpoint').attr('opacity',1);
const last=data.at(-1);endpoint.append('circle').attr('cx',x(last.time)).attr('cy',y(last.value)).attr('r',3.5).attr('fill','var(--viz-series-1)');
endpoint.append('text').attr('x',x(last.time)).attr('y',y(last.value)-12).attr('text-anchor','end').attr('font-weight',500).text(formatValue(last.value));
svg.append('line').attr('class','guide').attr('y1',top).attr('y2',base).attr('stroke','var(--foreground)').attr('stroke-opacity',.24).attr('visibility','hidden');
svg.append('circle').attr('class','active-halo').attr('r',9).attr('fill','var(--viz-series-1)').attr('fill-opacity',.14).attr('visibility','hidden');
svg.append('circle').attr('class','active-point').attr('r',4).attr('fill','var(--viz-series-1)').attr('stroke','var(--background)').attr('stroke-width',2).attr('visibility','hidden');
svg.append('rect').attr('class','hit').attr('x',left).attr('y',top).attr('width',width-left-right).attr('height',base-top).attr('fill','transparent').style('cursor','crosshair').on('pointerenter pointermove',event=>{const px=d3.pointer(event,svg.node())[0];show(d3.bisector(d=>d.time).center(data,x.invert(px)));}).on('pointerleave pointercancel',clear).on('pointerup',event=>{if(event.pointerType==='touch')clear();});
if(animate&&!reduced.matches){
const path=trend.node(),length=path.getTotalLength();
function moveHead(t){const point=path.getPointAtLength(length*t);endpoint.select('circle').attr('cx',point.x).attr('cy',point.y);endpoint.select('text').attr('x',point.x).attr('y',point.y-12).attr('text-anchor',point.x<left+20?'start':point.x>width-right-20?'end':'middle').text(formatValue(y.invert(point.y)));return point;}
moveHead(0);
trend.attr('stroke-dasharray',`${length} ${length}`).attr('stroke-dashoffset',length);
// 曲线按实际弧长绘制，面积边界跟随线头的横坐标。
trend.transition().duration(parseFloat(getComputedStyle(root).getPropertyValue('--line-enter'))).ease(d3.easeCubicInOut).tween('trace',()=>t=>{trend.attr('stroke-dashoffset',length*(1-t));clip.attr('width',Math.max(0,moveHead(t).x-left+8));}).on('end',()=>{trend.attr('stroke-dasharray',null).attr('stroke-dashoffset',null);clip.attr('width',width-left+8);moveHead(1);});
}
if(active!==null)show(active);
}
keyboard.addEventListener('input',()=>show(Number(keyboard.value)));keyboard.addEventListener('focus',()=>show(Number(keyboard.value)));keyboard.addEventListener('blur',clear);
root.addEventListener('pointerleave',clear);root.addEventListener('keydown',e=>{if(e.key==='Escape')clear();});window.addEventListener('blur',clear);
draw();if(!reduced.matches)svg.select('.line-marks').attr('visibility','hidden');
let inView=false,armed=true;
function replayIfReady(){if(inView&&armed&&!document.hidden){armed=false;entered=true;draw(true);}}
const observer=new IntersectionObserver(es=>{const e=es[0];if(!e.isIntersecting){inView=false;armed=true;}else if(e.intersectionRatio>=.2){inView=true;replayIfReady();}},{threshold:[0,.2]});
document.addEventListener('visibilitychange',()=>{if(document.hidden)armed=true;else replayIfReady();});
window.addEventListener('pageshow',e=>{if(e.persisted){armed=true;replayIfReady();}});observer.observe(root);
new ResizeObserver(()=>{if(Math.round(plot.getBoundingClientRect().width)!==lastWidth){draw();if(!entered&&!reduced.matches)svg.select('.line-marks').attr('visibility','hidden');}}).observe(plot);
})();
</script>
</div>
